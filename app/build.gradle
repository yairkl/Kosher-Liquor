plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yairkl.kosherliquorplus'
    compileSdk 34

    defaultConfig {
        applicationId "com.yairkl.kosherliquorplus"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
